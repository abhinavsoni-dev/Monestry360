<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Choose Your Monastery (Full Screen List)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(110deg, #ffe8c6 0%, #e3edfa 100%);
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100vw;
      min-height: 90vh;
    }
    header {
      text-align: center;
      margin-bottom: 22px;
    }
    header h1 {
      font-size: 3rem;
      color: #ffa02c;
      margin-bottom: 10px;
      letter-spacing: 1.4px;
    }
    header p {
      font-size: 1.25rem;
      color: #555;
    }
    ul.monastery-list {
      list-style: none;
      padding: 0;
      margin: 0;
      width: 100vw;
      max-width: 850px;
      background: rgba(255,255,255,0.85);
      border-radius: 22px;
      box-shadow: 0 12px 48px rgba(145,160,200,0.12);
      border: 1.5px solid #ffe8c6;
      display: flex;
      flex-direction: column;
    }
    ul.monastery-list li {
      border-bottom: 1px solid #f1f3f7;
      margin: 2px 0;
      flex: 1 0 auto;
    }
    ul.monastery-list li:last-child { border-bottom: none; }
    ul.monastery-list li a {
      display: block;
      padding: 32px 60px;
      color: #444;
      text-decoration: none;
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: 0.7px;
      transition: background 0.20s, color 0.20s;
    }
    ul.monastery-list li a:hover {
      background: #ffe3c6;
      color: #ffa02c;
    }
    footer {
      margin-top: 26px;
      color: #888;
      font-size: 1.08rem;
      text-align: center;
      background: #fff6ea;
      border-radius: 16px;
      padding: 9px 22px;
      box-shadow: 0 3px 32px rgba(255,160,44,0.10);
      opacity: 0.97;
    }
    @media (max-width: 980px) {
      ul.monastery-list { max-width: 94vw; }
      ul.monastery-list li a { padding: 24px 16px; font-size: 1.1rem; }
      header h1 { font-size: 2.1rem; }
    }
    @media (max-width: 480px) {
      main { min-height: 70vh; }
      ul.monastery-list li a { padding: 16px 7px; font-size: 1rem; }
      header h1 { font-size: 1.4rem; }
      header p { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Choose a Monastery</h1>
      <p>Select a monastery to explore its 360° Street View and Maps</p>
    </header>
    <ul class="monastery-list">
      <li><a href="rumtek.html">Rumtek Monastery</a></li>
      <li><a href="pemayangtse.html">Pemayangtse Monastery</a></li>
      <li><a href="tsukla.html">Tsukla Khang</a></li>
      <li><a href="enchey.html">Enchey Monastery</a></li>
      <li><a href="tsechey.html">Tsechey Monastery</a></li>
    </ul>
    <footer>
      Built with ❤️ for SIH Project
    </footer>
  </main>
</body>
</html>
